name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

env:
  DOCKER_USERNAME: thabsira
  BACKEND_IMAGE: thabsira/task-manager-backend
  FRONTEND_IMAGE: thabsira/task-manager-frontend

jobs:

  # =========================
  # CI - Build & Verify
  # =========================

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create environment file
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          cat > backend/.env << EOF
          PORT=3000
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          DB_NAME=$DB_NAME
          EOF

      - name: Build Docker Compose
        run: docker compose build

      - name: Validate Docker Compose
        run: docker compose config

  # =========================
  # CI - Frontend Check
  # =========================

  frontend-check:
    name: Check Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/script.js
          echo "Frontend files are present."

  # =========================
  # CD - Build & Push Images
  # =========================

  build-and-push:
    name: Build & Push Docker Images
    needs:
      - build
      - frontend-check

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # =========================
  # CD - Deployment
  # =========================

  deploy:
    name: Deploy
    needs: build-and-push

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deployment status
        run: |
          echo "Docker images successfully built and pushed to Docker Hub."
          echo "AWS EC2 deployment will be configured next."