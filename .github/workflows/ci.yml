name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

env:
  DOCKER_USERNAME: thabsira
  BACKEND_IMAGE: thabsira/task-manager-backend
  FRONTEND_IMAGE: thabsira/task-manager-frontend

jobs:

  # ==========================================
  # BUILD
  # ==========================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create backend environment file
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          cat > backend/.env << EOF
          PORT=3000
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          DB_NAME=$DB_NAME
          EOF

      - name: Build Docker Compose
        run: docker compose build

      - name: Validate Docker Compose
        run: docker compose config --quiet


  # ==========================================
  # FRONTEND CHECK
  # ==========================================
  frontend-check:
    name: Check Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/script.js
          test -f frontend/nginx.conf
          echo "Frontend files are present."


  # ==========================================
  # BUILD & PUSH DOCKER IMAGES
  # ==========================================
  build-and-push:
    name: Build and Push Docker Images
    needs:
      - build
      - frontend-check

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ------------------------------------------
      # BACKEND IMAGE
      # ------------------------------------------
      - name: Build and Push Backend
        uses: docker/build-push-action@v6

        with:
          context: ./backend
          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}


      # ------------------------------------------
      # FRONTEND IMAGE
      # ------------------------------------------
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6

        with:
          context: ./frontend
          push: true

          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}


  # ==========================================
  # DEPLOY TO AWS EC2
  # ==========================================
  deploy:
    name: Deploy to AWS EC2

    needs: build-and-push

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------
      # CHECKOUT
      # ------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # ------------------------------------------
      # CREATE DATABASE DIRECTORY
      # ------------------------------------------
      - name: Prepare database directory
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ vars.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_KEY }}
          port: 22

          script: |
            mkdir -p /home/ubuntu/task-manager/database


      # ------------------------------------------
      # COPY init.sql TO EC2
      # ------------------------------------------
      - name: Copy database schema to EC2
        uses: appleboy/scp-action@v0.1.7

        with:
          host: ${{ vars.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_KEY }}
          port: 22

          source: "database/init.sql"

          target: "/home/ubuntu/task-manager/"

          strip_components: 1

          overwrite: true


      # ------------------------------------------
      # DEPLOY APPLICATION
      # ------------------------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        env:
          BACKEND_IMAGE: thabsira/task-manager-backend
          FRONTEND_IMAGE: thabsira/task-manager-frontend

          IMAGE_TAG: ${{ github.sha }}

          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

        with:

          host: ${{ vars.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_KEY }}
          port: 22

          envs: BACKEND_IMAGE,FRONTEND_IMAGE,IMAGE_TAG,DB_USER,DB_PASSWORD,DB_NAME

          script: |

            set -e

            echo "======================================"
            echo "Starting EC2 deployment"
            echo "======================================"


            # --------------------------------------
            # INSTALL DOCKER IF REQUIRED
            # --------------------------------------

            if ! command -v docker >/dev/null 2>&1; then

              echo "Docker not found."
              echo "Installing Docker..."

              sudo apt-get update

              sudo apt-get install -y docker.io

              sudo systemctl enable docker

              sudo systemctl start docker

              echo "Docker installed successfully."

            else

              echo "Docker is already installed."

            fi


            sudo docker --version


            # --------------------------------------
            # VERIFY DATABASE SCHEMA
            # --------------------------------------

            echo "======================================"
            echo "Checking database schema"
            echo "======================================"

            sudo mkdir -p /home/ubuntu/task-manager/database

            if [ ! -f /home/ubuntu/task-manager/database/init.sql ]; then

              echo "ERROR: init.sql was not copied correctly."

              echo "Searching for init.sql..."

              sudo find /home/ubuntu/task-manager \
                -name "init.sql" \
                -type f \
                -ls

              exit 1

            fi

            sudo chmod 644 \
              /home/ubuntu/task-manager/database/init.sql

            echo "Database schema found:"

            sudo ls -lh \
              /home/ubuntu/task-manager/database/init.sql


            # --------------------------------------
            # CREATE DOCKER NETWORK
            # --------------------------------------

            echo "======================================"
            echo "Creating Docker network"
            echo "======================================"

            sudo docker network create task-network 2>/dev/null || true


            # --------------------------------------
            # REMOVE OLD CONTAINERS
            # --------------------------------------

            echo "======================================"
            echo "Removing old containers"
            echo "======================================"

            sudo docker rm -f task-manager-frontend 2>/dev/null || true

            sudo docker rm -f task-manager-backend 2>/dev/null || true

            sudo docker rm -f task-manager-postgres 2>/dev/null || true


            # --------------------------------------
            # REMOVE OLD DATABASE VOLUME
            # --------------------------------------
            #
            # IMPORTANT:
            # This is being done now only so that
            # the corrected init.sql runs on the
            # existing broken deployment.
            #
            # Later, once the database works,
            # REMOVE this volume deletion to
            # preserve database data.
            #

            echo "Removing old PostgreSQL volume..."

            sudo docker volume rm \
              task-manager-postgres-data 2>/dev/null || true


            # --------------------------------------
            # PULL BACKEND IMAGE
            # --------------------------------------

            echo "======================================"
            echo "Pulling backend image"
            echo "======================================"

            sudo docker pull \
              ${BACKEND_IMAGE}:${IMAGE_TAG}


            # --------------------------------------
            # PULL FRONTEND IMAGE
            # --------------------------------------

            echo "======================================"
            echo "Pulling frontend image"
            echo "======================================"

            sudo docker pull \
              ${FRONTEND_IMAGE}:${IMAGE_TAG}


            # --------------------------------------
            # PULL POSTGRES
            # --------------------------------------

            echo "======================================"
            echo "Pulling PostgreSQL image"
            echo "======================================"

            sudo docker pull postgres:16-alpine


            # --------------------------------------
            # CREATE DATABASE VOLUME
            # --------------------------------------

            sudo docker volume create \
              task-manager-postgres-data


            # --------------------------------------
            # START POSTGRES
            # --------------------------------------

            echo "======================================"
            echo "Starting PostgreSQL"
            echo "======================================"

            sudo docker run -d \
              --name task-manager-postgres \
              --network task-network \
              -e POSTGRES_USER="${DB_USER}" \
              -e POSTGRES_PASSWORD="${DB_PASSWORD}" \
              -e POSTGRES_DB="${DB_NAME}" \
              -v task-manager-postgres-data:/var/lib/postgresql/data \
              -v /home/ubuntu/task-manager/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro \
              postgres:16-alpine


            # --------------------------------------
            # WAIT FOR POSTGRES
            # --------------------------------------

            echo "======================================"
            echo "Waiting for PostgreSQL"
            echo "======================================"

            for i in {1..30}
            do

              if sudo docker exec task-manager-postgres \
                pg_isready \
                -U "${DB_USER}" \
                -d "${DB_NAME}" >/dev/null 2>&1
              then

                echo "PostgreSQL is ready."

                break

              fi

              echo "Waiting... attempt $i"

              sleep 2

            done


            # --------------------------------------
            # CHECK POSTGRES STATUS
            # --------------------------------------

            if ! sudo docker exec task-manager-postgres \
              pg_isready \
              -U "${DB_USER}" \
              -d "${DB_NAME}" >/dev/null 2>&1
            then

              echo "ERROR: PostgreSQL failed to start."

              sudo docker logs task-manager-postgres

              exit 1

            fi


            # --------------------------------------
            # CHECK DATABASE TABLES
            # --------------------------------------

            echo "======================================"
            echo "Checking database tables"
            echo "======================================"

            sudo docker exec task-manager-postgres \
              psql \
              -U "${DB_USER}" \
              -d "${DB_NAME}" \
              -c "\dt"


            # --------------------------------------
            # START BACKEND
            # --------------------------------------

            echo "======================================"
            echo "Starting backend"
            echo "======================================"

            sudo docker run -d \
              --name task-manager-backend \
              --network task-network \
              -p 3000:3000 \
              -e PORT=3000 \
              -e DB_HOST=task-manager-postgres \
              -e DB_PORT=5432 \
              -e DB_USER="${DB_USER}" \
              -e DB_PASSWORD="${DB_PASSWORD}" \
              -e DB_NAME="${DB_NAME}" \
              ${BACKEND_IMAGE}:${IMAGE_TAG}


            # --------------------------------------
            # START FRONTEND
            # --------------------------------------

            echo "======================================"
            echo "Starting frontend"
            echo "======================================"

            sudo docker run -d \
              --name task-manager-frontend \
              --network task-network \
              -p 8080:80 \
              ${FRONTEND_IMAGE}:${IMAGE_TAG}


            # --------------------------------------
            # WAIT FOR APPLICATION
            # --------------------------------------

            echo "Waiting for application..."

            sleep 5


            # --------------------------------------
            # SHOW CONTAINERS
            # --------------------------------------

            echo "======================================"
            echo "Running Containers"
            echo "======================================"

            sudo docker ps


            # --------------------------------------
            # FRONTEND LOGS
            # --------------------------------------

            echo "======================================"
            echo "Frontend Logs"
            echo "======================================"

            sudo docker logs \
              --tail 20 \
              task-manager-frontend


            # --------------------------------------
            # BACKEND LOGS
            # --------------------------------------

            echo "======================================"
            echo "Backend Logs"
            echo "======================================"

            sudo docker logs \
              --tail 20 \
              task-manager-backend


            # --------------------------------------
            # DEPLOYMENT COMPLETE
            # --------------------------------------

            echo "======================================"
            echo "Deployment Completed Successfully!"
            echo "======================================"

            echo "Application URL:"

            echo "http://${HOST_IP}:8080"