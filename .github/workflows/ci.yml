name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

env:
  DOCKER_USERNAME: thabsira
  BACKEND_IMAGE: thabsira/task-manager-backend
  FRONTEND_IMAGE: thabsira/task-manager-frontend

jobs:

  # ==========================================
  # BUILD APPLICATION
  # ==========================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create backend environment file
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          cat > backend/.env << EOF
          PORT=3000
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          DB_NAME=$DB_NAME
          EOF

      - name: Build Docker Compose
        run: docker compose build

      - name: Validate Docker Compose
        run: docker compose config --quiet


  # ==========================================
  # FRONTEND CHECK
  # ==========================================
  frontend-check:
    name: Check Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/script.js
          test -f frontend/nginx.conf
          echo "Frontend files are present."


  # ==========================================
  # BUILD AND PUSH DOCKER IMAGES
  # ==========================================
  build-and-push:
    name: Build and Push Docker Images
    needs:
      - build
      - frontend-check

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}


  # ==========================================
  # DEPLOY TO AWS EC2
  # ==========================================
  deploy:
    name: Deploy to EC2
    needs: build-and-push

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # --------------------------------------
      # CHECKOUT
      # --------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------
      # PREPARE EC2 DIRECTORY
      # --------------------------------------
      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_KEY }}
          port: 22

          script: |
            mkdir -p /home/ubuntu/task-manager/database


      # --------------------------------------
      # COPY DATABASE SCHEMA
      # --------------------------------------
      - name: Copy database schema
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_KEY }}
          port: 22

          source: "database/init.sql"
          target: "/home/ubuntu/task-manager/"

          overwrite: true


      # --------------------------------------
      # DEPLOY TO EC2
      # --------------------------------------
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0

        env:
          BACKEND_IMAGE: thabsira/task-manager-backend
          FRONTEND_IMAGE: thabsira/task-manager-frontend
          IMAGE_TAG: ${{ github.sha }}

          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

        with:
          host: ${{ vars.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_KEY }}
          port: 22

          envs: BACKEND_IMAGE,FRONTEND_IMAGE,IMAGE_TAG,DB_USER,DB_PASSWORD,DB_NAME

          script: |

            set -e

            echo "======================================"
            echo "STARTING EC2 DEPLOYMENT"
            echo "======================================"


            # --------------------------------------
            # INSTALL DOCKER IF NEEDED
            # --------------------------------------

            if ! command -v docker >/dev/null 2>&1; then

              echo "Docker not found."

              sudo apt-get update
              sudo apt-get install -y docker.io

              sudo systemctl enable docker
              sudo systemctl start docker

            fi

            sudo docker --version


            # --------------------------------------
            # PREPARE DATABASE SCHEMA
            # --------------------------------------

            echo "======================================"
            echo "Preparing database schema"
            echo "======================================"

            sudo mkdir -p /home/ubuntu/task-manager/database

            # Remove old incorrect file/directory
            sudo rm -rf /home/ubuntu/task-manager/database/init.sql

            # If SCP placed init.sql directly here
            if [ -f /home/ubuntu/task-manager/init.sql ]; then

              echo "Found init.sql in task-manager directory."

              sudo cp \
                /home/ubuntu/task-manager/init.sql \
                /home/ubuntu/task-manager/database/init.sql

            # If SCP created database/database/init.sql
            elif [ -f /home/ubuntu/task-manager/database/database/init.sql ]; then

              echo "Found init.sql in nested database directory."

              sudo cp \
                /home/ubuntu/task-manager/database/database/init.sql \
                /home/ubuntu/task-manager/database/init.sql

            else

              echo "ERROR: init.sql not found."

              echo "Searching for init.sql..."

              sudo find /home/ubuntu/task-manager \
                -name "init.sql" \
                -type f \
                -ls

              exit 1

            fi

            sudo chmod 644 \
              /home/ubuntu/task-manager/database/init.sql

            echo "Database schema ready:"

            sudo ls -lh \
              /home/ubuntu/task-manager/database/init.sql


            # --------------------------------------
            # CREATE DOCKER NETWORK
            # --------------------------------------

            echo "======================================"
            echo "Creating Docker network"
            echo "======================================"

            sudo docker network create task-network 2>/dev/null || true


            # --------------------------------------
            # REMOVE OLD CONTAINERS
            # --------------------------------------

            echo "======================================"
            echo "Removing old containers"
            echo "======================================"

            sudo docker rm -f task-manager-frontend 2>/dev/null || true
            sudo docker rm -f task-manager-backend 2>/dev/null || true
            sudo docker rm -f task-manager-postgres 2>/dev/null || true


            # --------------------------------------
            # RESET DATABASE VOLUME
            # --------------------------------------
            # Only for fixing the current broken DB.
            # --------------------------------------

            echo "Removing old PostgreSQL volume..."

            sudo docker volume rm \
              task-manager-postgres-data 2>/dev/null || true

            sudo docker volume create \
              task-manager-postgres-data


            # --------------------------------------
            # PULL BACKEND
            # --------------------------------------

            echo "======================================"
            echo "Pulling backend image"
            echo "======================================"

            sudo docker pull \
              ${BACKEND_IMAGE}:${IMAGE_TAG}


            # --------------------------------------
            # PULL FRONTEND
            # --------------------------------------

            echo "======================================"
            echo "Pulling frontend image"
            echo "======================================"

            sudo docker pull \
              ${FRONTEND_IMAGE}:${IMAGE_TAG}


            # --------------------------------------
            # PULL POSTGRES
            # --------------------------------------

            echo "======================================"
            echo "Pulling PostgreSQL"
            echo "======================================"

            sudo docker pull postgres:16-alpine


            # --------------------------------------
            # START POSTGRES
            # --------------------------------------

            echo "======================================"
            echo "Starting PostgreSQL"
            echo "======================================"

            sudo docker run -d \
              --name task-manager-postgres \
              --network task-network \
              -e POSTGRES_USER="${DB_USER}" \
              -e POSTGRES_PASSWORD="${DB_PASSWORD}" \
              -e POSTGRES_DB="${DB_NAME}" \
              -v task-manager-postgres-data:/var/lib/postgresql/data \
              -v /home/ubuntu/task-manager/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro \
              postgres:16-alpine


            # --------------------------------------
            # WAIT FOR POSTGRES
            # --------------------------------------

            echo "======================================"
            echo "Waiting for PostgreSQL"
            echo "======================================"

            POSTGRES_READY=false

            for i in {1..30}
            do

              if sudo docker exec task-manager-postgres \
                pg_isready \
                -U "${DB_USER}" \
                -d "${DB_NAME}" >/dev/null 2>&1
              then

                echo "PostgreSQL is ready."

                POSTGRES_READY=true

                break

              fi

              echo "Waiting... attempt $i"

              sleep 2

            done


            # --------------------------------------
            # CHECK POSTGRES
            # --------------------------------------

            if [ "$POSTGRES_READY" != "true" ]; then

              echo "ERROR: PostgreSQL failed."

              sudo docker logs task-manager-postgres

              exit 1

            fi


            # --------------------------------------
            # CHECK DATABASE TABLES
            # --------------------------------------

            echo "======================================"
            echo "Checking database tables"
            echo "======================================"

            sudo docker exec task-manager-postgres \
              psql \
              -U "${DB_USER}" \
              -d "${DB_NAME}" \
              -c "\dt"


            # --------------------------------------
            # START BACKEND
            # --------------------------------------

            echo "======================================"
            echo "Starting Backend"
            echo "======================================"

            sudo docker run -d \
              --name task-manager-backend \
              --network task-network \
              -p 3000:3000 \
              -e PORT=3000 \
              -e DB_HOST=task-manager-postgres \
              -e DB_PORT=5432 \
              -e DB_USER="${DB_USER}" \
              -e DB_PASSWORD="${DB_PASSWORD}" \
              -e DB_NAME="${DB_NAME}" \
              ${BACKEND_IMAGE}:${IMAGE_TAG}


            # --------------------------------------
            # START FRONTEND
            # --------------------------------------

            echo "======================================"
            echo "Starting Frontend"
            echo "======================================"

            sudo docker run -d \
              --name task-manager-frontend \
              --network task-network \
              -p 8080:80 \
              ${FRONTEND_IMAGE}:${IMAGE_TAG}


            # --------------------------------------
            # WAIT
            # --------------------------------------

            echo "Waiting for application..."

            sleep 5


            # --------------------------------------
            # SHOW CONTAINERS
            # --------------------------------------

            echo "======================================"
            echo "RUNNING CONTAINERS"
            echo "======================================"

            sudo docker ps


            # --------------------------------------
            # FRONTEND LOGS
            # --------------------------------------

            echo "======================================"
            echo "FRONTEND LOGS"
            echo "======================================"

            sudo docker logs \
              --tail 20 \
              task-manager-frontend


            # --------------------------------------
            # BACKEND LOGS
            # --------------------------------------

            echo "======================================"
            echo "BACKEND LOGS"
            echo "======================================"

            sudo docker logs \
              --tail 20 \
              task-manager-backend


            # --------------------------------------
            # SUCCESS
            # --------------------------------------

            echo "======================================"
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "======================================"

            echo "Application URL:"
            echo "http://${HOST_IP}:8080"